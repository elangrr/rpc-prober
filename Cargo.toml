[package]
name = "rpc-prober"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Check many blockchain RPC endpoints at once: up/down, height, lag, latency."
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
toml = "1"

[dev-dependencies]
wiremock = "0.6"
