# rpc-prober config for Indonode's public RPCs.
# Each [[chain]] lists RPCs for one chain. The first RPC is Indonode's own.
# The others are public RPCs from the Cosmos chain registry, used as a reference height.
#
# timeout_ms:  how long one endpoint may take before it counts as down (default 5000).
# concurrency: how many endpoints are checked at the same time (default 16).
# chain_id:    optional. If set, an endpoint on another chain gets status "wrong_chain".
#              For type = "evm" write the decimal chain id (Epix EVM is 1916).

timeout_ms = 5000
concurrency = 16

[[chain]]
name = "atomone"
type = "cosmos"
chain_id = "atomone-1"
rpcs = [
  "https://rpc.atomone.indonode.net",
  "https://atomone-rpc.allinbits.services",
  "https://rpc-atomone.ecostake.com",
]

